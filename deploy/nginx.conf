# =============================================================================
# Kelvynlabs — Nginx en frontal (VPS Hostinger)
# =============================================================================
# À placer dans /etc/nginx/sites-available/kelvynlabs puis :
#   ln -s /etc/nginx/sites-available/kelvynlabs /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Le TLS est ensuite ajouté automatiquement par :
#   certbot --nginx -d votre-domaine.fr -d www.votre-domaine.fr
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name votre-domaine.fr www.votre-domaine.fr;

    # --- Uploads -------------------------------------------------------------
    # ⚠️ LA ligne à ne pas oublier. Nginx plafonne les corps de requête à 1 Mo
    # par défaut : sans cette directive, tout envoi de PDF échouerait par un
    # « 413 Request Entity Too Large » côté serveur, avant même d'atteindre
    # l'application — et le message d'erreur, côté navigateur, serait opaque.
    client_max_body_size 100M;

    # Un gros fichier sur une connexion lente peut dépasser la minute.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # --- En-têtes de sécurité ------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Décommentez APRÈS avoir vérifié que le HTTPS fonctionne : ce réglage
    # engage les navigateurs pour deux ans et n'est pas révocable côté serveur.
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # --- Fichiers servis par l'application -----------------------------------
    # Les uploads passent volontairement par l'application (et non par un alias
    # Nginx direct) : c'est ce qui permet à checkAccess() de contrôler l'accès
    # aux ressources téléchargeables. Ne court-circuitez pas ce chemin.

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Nécessaire au Fast Refresh en développement et aux futures
        # fonctionnalités temps réel.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_buffering off;
    }

    # Les fichiers statiques de Next portent un hash dans leur nom : ils ne
    # changent jamais à URL constante, on peut les garder en cache un an.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
